<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doceria - Charme</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="src/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Header com fundo rosa -->
    <header class="py-3" style="background-color: #f8c8dc">
      <div class="container text-center">
        <h1 class="fw-bold display-5 m-0">Charme</h1>
        <p class="mb-2 text-muted">Cardápio digital</p>

        <!-- Menu com a classe navbar-expand-lg corrigida -->
        <nav class="navbar navbar-expand-lg navbar-light p-0">
          <div class="container-fluid justify-content-end">
            <button
              class="navbar-toggler my-2"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#menu"
              aria-controls="menu"
              aria-expanded="false"
              aria-label="Abrir menu"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="menu">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link fw-semibold" href="#cardapio">Cardápio</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link fw-semibold" href="#contato">Contato</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container my-5">
      <section id="contato" class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <h2 class="text-center mb-4 fw-bold">
            Entre em contato com nossa produção!
          </h2>
          <form>
            <div class="mb-3">
              <label for="nome" class="form-label fw-semibold"
                >Digite seu nome</label
              >
              <input
                type="text"
                id="nome"
                class="form-control"
                placeholder="Nome completo"
              />
            </div>

            <div class="mb-3">
              <label for="doces" class="form-label fw-semibold"
                >Escolha seus doces</label
              >
              <select class="form-select" id="doces">
                <option selected>Selecione...</option>
                <option value="1">Morango do amor</option>
                <option value="2">Espetinho de uva com chocolate</option>
                <option value="3">Bolo no pote</option>
              </select>
            </div>

            <!-- Botão com fallback de estilo inline caso precise ver funcionando agora -->
            <button
              type="submit"
              class="btn btn-rosa w-100 mt-3"
              style="background-color: #d63384; color: white"
            >
              Finalizar Pedido
            </button>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
